services:
  - type: web
    name: banking-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Set these in the Render dashboard (values are not stored in this file).
      - key: DATABASE_URL        # Neon (or any Postgres) connection string
        sync: false
      - key: EXTRA_CORS_ORIGINS  # URL of the deployed frontend
        sync: false

  - type: web
    name: banking-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      # Set in the Render dashboard to the deployed backend URL, then redeploy
      # (Next.js bakes NEXT_PUBLIC_* values in at build time).
      - key: NEXT_PUBLIC_API_URL
        sync: false
