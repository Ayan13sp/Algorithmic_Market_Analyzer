# ════════════════════════════════════════════════════════════════════════
# Docker Compose — Algorithmic Market Analyzer
# ════════════════════════════════════════════════════════════════════════
# Services:
#   db       – PostgreSQL 16 (persistent data)
#   mlflow   – MLflow tracking server + model registry (http://localhost:5001)
#   backend  – FastAPI + ML engine
#   frontend – Next.js dashboard
#
# Usage:
#   docker compose up --build
#   Open http://localhost:3000
# ════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_pass
      POSTGRES_DB: market_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_user -d market_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MLflow Tracking Server ───────────────────────────────────────────
  # Runs, metrics and the model registry live in SQLite; model artifacts are
  # proxied through the server (--serve-artifacts), so the backend needs no
  # shared filesystem.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5001:5000"   # host 5001: macOS AirPlay Receiver already owns :5000
    volumes:
      - mlflowdata:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    # CI builds and loads this image once, then runs `docker compose up --no-build`.
    image: ${BACKEND_IMAGE:-algorithmic-market-analyzer-backend:local}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://market_user:market_pass@db:5432/market_analyzer
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Fail fast instead of MLflow's default multi-minute retry backoff
      # if the tracking server is down (tracking is best-effort).
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Next.js Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: ${FRONTEND_IMAGE:-algorithmic-market-analyzer-frontend:local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Next.js standalone binds to $HOSTNAME, which Docker sets to the container ID.
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
  mlflowdata:
